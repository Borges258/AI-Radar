name: Daily Info Radar

on:
  schedule:
    # UTC 22:37 = 北京时间次日 06:37（避开整点高峰）
    - cron: "37 22 * * *"
  workflow_dispatch: {}

# 串行化运行，避免手动补跑与定时任务重复生成
concurrency: daily-info-radar

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        shell: bash
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -d "digests/$DATE" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip: digests/$DATE already exists"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  radar:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: npm start

      - name: Commit digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests data
          git commit -m "chore(radar): $(TZ=Asia/Shanghai date +%F) daily digest" || echo "no changes"
          git push